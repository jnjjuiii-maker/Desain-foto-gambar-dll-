<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Studio Kope Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;900&family=Pacifico&family=Bebas+Neue&family=Caveat:wght@600&family=Poppins:wght@400;600;800&family=Oswald:wght@500;700&family=Lobster&family=Montserrat:wght@500;800&display=swap">
<style>
/* Layout: top bar + icon rail + tool panel + canvas stage + properties + page strip. Portrait: rail moves to bottom, panel becomes a sheet. */
:root{
  --bg:#eceaf3; --surface:#ffffff; --surface2:#f4f2fa; --line:#dcd8ea; --fg:#1d1a2b; --muted:#6b6683;
  --accent:#5b3df5; --accent2:#ff5e8a; --accent-fg:#ffffff; --stage:#dedbe9; --shadow:0 6px 24px rgba(40,25,100,.14);
  --f-display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif;
  --rail:72px; --panel:312px; --props:268px; --top:56px; --strip:104px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--surface:#1f1c2e;--surface2:#282439;--line:#383350;--fg:#f0eefb;--muted:#a29cc0;--accent:#8b72ff;--accent2:#ff7aa0;--accent-fg:#12101c;--stage:#100e19;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131f;--surface:#1f1c2e;--surface2:#282439;--line:#383350;--fg:#f0eefb;--muted:#a29cc0;--accent:#8b72ff;--accent2:#ff7aa0;--accent-fg:#12101c;--stage:#100e19;--shadow:0 6px 24px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-body);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));user-select:none;-webkit-user-select:none;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-rows:var(--top) 1fr var(--strip);grid-template-columns:var(--rail) var(--panel) 1fr var(--props);grid-template-areas:"top top top top" "rail panel stage props" "rail panel strip props"}
#app.nopanel{grid-template-columns:var(--rail) 0 1fr var(--props)}
#app.noprops{grid-template-columns:var(--rail) var(--panel) 1fr 0}
#app.nopanel.noprops{grid-template-columns:var(--rail) 0 1fr 0}
#top{grid-area:top;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.brand{font:800 18px var(--f-display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin-right:8px;white-space:nowrap}
.brand i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--accent),var(--accent2),#ffb340,var(--accent));display:block}
.tb{height:36px;min-width:36px;padding:0 10px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;color:var(--fg);white-space:nowrap}
.tb:hover:not(:disabled){background:var(--surface2)}
.tb:disabled{opacity:.35;cursor:default}
.tb.pri{background:var(--accent);color:var(--accent-fg);font-weight:700;padding:0 16px}
.tb.pri:hover{filter:brightness(1.08);background:var(--accent)}
.tb svg,.rb svg,.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#title{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;width:180px;min-width:60px;font-weight:700}
#title:hover,#title:focus{border-color:var(--line);background:var(--surface2)}
.sp{flex:1}
#rail{grid-area:rail;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;overflow:auto}
.rb{flex:none;width:60px;padding:8px 0 6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.rb:hover{background:var(--surface2);color:var(--fg)}
.rb.on{color:var(--accent);background:var(--surface2)}
.rb.on svg{stroke:var(--accent)}
#panel{grid-area:panel;background:var(--surface);border-right:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;min-width:0}
#app.nopanel #panel{display:none}
.phead{padding:14px 16px 8px;font:700 16px var(--f-display);display:flex;align-items:center;justify-content:space-between}
.pbody{overflow:auto;padding:4px 16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.sec{font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{border:1px solid var(--line);border-radius:10px;background:var(--surface2);overflow:hidden;position:relative;display:block;width:100%}
.card:hover{border-color:var(--accent)}
.card canvas,.card img{display:block;width:100%;height:auto}
.card .cap{font-size:11px;padding:4px 6px;color:var(--muted);text-align:left}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface2);font-size:12px;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.big{width:100%;padding:12px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:700}
.big.alt{background:var(--surface2);color:var(--fg);border:1px dashed var(--line)}
.txtbtn{width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px}
.txtbtn:hover{border-color:var(--accent)}
.sw{width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--line)}
.sw:hover{transform:scale(1.08)}
.emo{font-size:26px;aspect-ratio:1;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.emo:hover{border-color:var(--accent)}
input[type=search],input[type=text],input[type=number],select{width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface2)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;display:flex;justify-content:space-between}
#stage{grid-area:stage;position:relative;background:var(--stage);overflow:hidden;touch-action:none;min-width:0;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ctx{position:absolute;display:none;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);z-index:5}
.ib{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.ib:hover{background:var(--surface2)}.ib.on{color:var(--accent);background:var(--surface2)}
#zoom{position:absolute;right:12px;bottom:10px;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow);z-index:4}
#zoom span{min-width:46px;text-align:center;font-weight:700;font-size:12px}
#hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--muted);pointer-events:none}
#edit{position:absolute;display:none;background:transparent;border:1px dashed var(--accent);resize:none;overflow:hidden;padding:0;margin:0;outline:none;z-index:6;white-space:pre-wrap;word-break:break-word;transform-origin:0 0;user-select:text;-webkit-user-select:text}
#strip{grid-area:strip;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 12px;overflow-x:auto;min-width:0}
.pg{flex:none;height:76px;border-radius:8px;border:2px solid var(--line);background:var(--surface2);position:relative;overflow:hidden;display:flex}
.pg canvas{height:100%;width:auto;display:block}
.pg.on{border-color:var(--accent)}
.pg b{position:absolute;left:4px;bottom:3px;font-size:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:0 5px}
.padd{flex:none;height:76px;width:76px;border-radius:8px;border:2px dashed var(--line);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;gap:2px}
.padd:hover{border-color:var(--accent);color:var(--accent)}
#props{grid-area:props;background:var(--surface);border-left:1px solid var(--line);overflow:auto;min-width:0}
#app.noprops #props{display:none}
#props .pb{padding:4px 16px 24px}
.row{display:flex;gap:6px;align-items:center}
.row>*{min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;height:34px;display:flex;align-items:center;justify-content:center;background:var(--surface2);color:var(--fg)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lay{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);margin-bottom:6px;background:var(--surface2);cursor:grab}
.lay.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.lay .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.lay .ib{width:28px;height:28px}
.lay.drag{opacity:.4}
#modal{position:fixed;inset:0;background:rgba(10,8,20,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.mbox{background:var(--surface);border-radius:18px;max-width:560px;width:100%;max-height:92%;overflow:auto;padding:20px;box-shadow:var(--shadow)}
.mbox h3{margin:0 0 12px;font:800 20px var(--f-display)}
.mbox img{max-width:100%;max-height:300px;display:block;margin:0 auto 12px;border-radius:8px;border:1px solid var(--line);background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px;-webkit-user-select:auto;user-select:auto}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;display:none;z-index:60;max-width:90%}
#drop{position:fixed;inset:0;background:color-mix(in srgb,var(--accent) 30%,transparent);border:4px dashed var(--accent);display:none;align-items:center;justify-content:center;font:800 28px var(--f-display);z-index:40;pointer-events:none}
#menu{position:fixed;display:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:30;padding:4px;min-width:170px}
#menu button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:8px}
#menu button:hover{background:var(--surface2)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.hide-sm{display:inline}
#closep{display:none}
/* Portrait / narrow phones: bottom nav, sheet panel, floating props */
@media (max-width:700px),(orientation:portrait) and (max-width:1100px){
  :root{--top:50px;--strip:88px;--rail:0px}
  #app,#app.nopanel,#app.noprops,#app.nopanel.noprops{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr var(--strip) 64px;grid-template-areas:"top" "stage" "strip" "rail"}
  #rail{flex-direction:row;border-right:0;border-top:1px solid var(--line);justify-content:flex-start;padding:4px 6px;gap:0;overflow-x:auto;padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
  .rb{width:auto;min-width:62px;flex:none;padding:6px 8px}
  #panel,#props{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:52%;z-index:20;border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(20,10,60,.25)}
  #app.nopanel #panel{display:none}
  #app.noprops #props{display:none}
  #props{height:44%;z-index:21}
  #closep{display:inline-flex}
  .hide-sm{display:none}
  #title{display:none}
  #b-theme,#b-present{display:none}
  #top{gap:2px;padding:0 8px}
  .tb{padding:0 8px}.tb.pri{padding:0 12px}
  .brand span{display:none}
  .pg{height:62px}.padd{height:62px;width:62px}
  #hint{display:none}
}
/* Landscape phones: slimmer chrome */
@media (max-height:480px) and (orientation:landscape){
  :root{--top:44px;--strip:72px;--rail:56px;--panel:250px;--props:230px}
  .rb{width:50px;padding:5px 0 3px}.rb span:last-child{display:none}
  .pg{height:52px}.padd{height:52px;width:52px}
  #hint{display:none}
}

 <header id="top">

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const K={}; window.K=K; K.$=$; K.$$=$$; K.uid=uid; K.clamp=clamp;
const FONTS=['Bricolage Grotesque','DM Sans','Poppins','Montserrat','Oswald','Bebas Neue','Playfair Display','Lobster','Pacifico','Caveat','Georgia','Courier New','Arial Black'];
K.FONTS=FONTS;
const IM={}; K.IM=IM; // image registry id -> {url, el}
const S={title:'Desain tanpa judul',pages:[],cur:0,sel:[],zoom:1,ox:0,oy:0,tool:'select',pen:{c:'#5b3df5',size:8},snap:true,grid:false};
K.S=S;
const page=()=>S.pages[S.cur];
K.page=page;
const find=id=>page().objs.find(o=>o.id===id);
K.find=find;
const selObjs=()=>S.sel.map(find).filter(Boolean);
K.selObjs=selObjs;

/* ---------- history ---------- */
let hist=[],hi=-1,hTimer=null;
const snap=()=>JSON.stringify({p:S.pages,c:S.cur,t:S.title});
K.commit=(now)=>{
  const run=()=>{const s=snap();if(hist[hi]===s)return;hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>80)hist.shift();hi=hist.length-1;updUndo();autosave();};
  clearTimeout(hTimer); if(now)run(); else hTimer=setTimeout(run,350);
};
function restore(s){const d=JSON.parse(s);S.pages=d.p;S.cur=Math.min(d.c,d.p.length-1);S.title=d.t;$('#title').value=S.title;S.sel=S.sel.filter(id=>find(id));K.refresh(true);}
K.undo=()=>{clearTimeout(hTimer);K.commit(true);if(hi>0){hi--;restore(hist[hi]);updUndo();}};
K.redo=()=>{if(hi<hist.length-1){hi++;restore(hist[hi]);updUndo();}};
function updUndo(){$('#b-undo').disabled=hi<=0;$('#b-redo').disabled=hi>=hist.length-1;}

/* ---------- autosave ---------- */
let aTimer=null;
function autosave(){clearTimeout(aTimer);aTimer=setTimeout(()=>{K.store&&K.store.save&&K.store.save();},900);}
K.serialize=(withImgs=true)=>{
  const used={};const ids=new Set();
  S.pages.forEach(p=>p.objs.forEach(o=>{if(o.type==='image')ids.add(o.src);}));
  ids.forEach(i=>{if(IM[i])used[i]=IM[i].url;});
  return JSON.stringify({v:1,title:S.title,pages:S.pages,images:used});
};
K.load=(txt)=>{
  const d=JSON.parse(txt);
  Object.entries(d.images||{}).forEach(([id,url])=>K.regImage(url,id));
  S.title=d.title||'Desain';S.pages=d.pages;S.cur=0;S.sel=[];$('#title').value=S.title;
  hist=[];hi=-1;K.fit();K.refresh(true);K.commit(true);
};

/* ---------- images ---------- */
K.regImage=(url,id)=>{
  id=id||uid();const el=new Image();el.onload=()=>K.draw();el.src=url;IM[id]={url,el};return id;
};

/* ---------- fonts ---------- */
const fontReq={};
K.ensureFont=(name,weight=400,italic=false)=>{
  const key=name+weight+italic;if(fontReq[key])return;fontReq[key]=1;
  if(document.fonts&&document.fonts.load)document.fonts.load(`${italic?'italic ':''}${weight} 24px "${name}"`).then(()=>{K.draw();K.thumbs();}).catch(()=>{});
};
const fontStr=o=>`${o.italic?'italic ':''}${o.weight||400} ${o.size}px "${o.font}",sans-serif`;

/* ---------- object factory ---------- */
const base=(type,x,y,w,h,extra)=>Object.assign({id:uid(),type,x,y,w,h,rot:0,op:1,lock:false,hide:false,fx:false,fy:false,shadow:null,name:''},extra);
K.mkText=(text,x,y,opt={})=>base('text',x,y,opt.w||600,100,Object.assign({text,font:'Bricolage Grotesque',size:80,weight:700,italic:false,under:false,align:'center',color:'#1d1a2b',lh:1.15,ls:0,upper:false,name:text.slice(0,24)},opt));
K.mkShape=(kind,x,y,w,h,opt={})=>base('shape',x,y,w,h,Object.assign({kind,fill:'#5b3df5',fill2:null,ang:45,stroke:'#000000',sw:0,radius:0,name:kind},opt));
K.mkImage=(src,x,y,w,h,opt={})=>base('image',x,y,w,h,Object.assign({src,f:{br:100,ct:100,sa:100,bl:0,gr:0,se:0,hu:0},radius:0,name:'Foto'},opt));
K.mkDraw=(pts,color,size)=>{
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),y0=Math.min(...ys),x1=Math.max(...xs),y1=Math.max(...ys);
  const w=Math.max(1,x1-x0),h=Math.max(1,y1-y0);
  return base('draw',x0,y0,w,h,{pts:pts.map(p=>[(p[0]-x0)/w,(p[1]-y0)/h]),color,size,name:'Coretan'});
};

/* ---------- text layout ---------- */
const mctx=document.createElement('canvas').getContext('2d');
K.layout=(o,ctx)=>{
  ctx=ctx||mctx;ctx.font=fontStr(o);
  if('letterSpacing' in ctx)ctx.letterSpacing=(o.ls||0)+'px';
  const lines=[];const txt=o.upper?o.text.toUpperCase():o.text;
  txt.split('\n').forEach(par=>{
    const words=par.split(' ');let line='';
    words.forEach(w=>{
      const t=line?line+' '+w:w;
      if(ctx.measureText(t).width>o.w&&line){lines.push(line);line=w;}else line=t;
    });
    lines.push(line);
  });
  o.h=Math.max(o.size*o.lh,lines.length*o.size*o.lh);
  return lines;
};

/* ---------- shape paths ---------- */
function shapePath(c,k,w,h,r){
  c.beginPath();
  const x=-w/2,y=-h/2;
  switch(k){
    case 'rect':case 'round':{r=Math.min(r,w/2,h/2);if(r>0){c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}else c.rect(x,y,w,h);break;}
    case 'ellipse':c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);break;
    case 'triangle':c.moveTo(0,y);c.lineTo(x+w,y+h);c.lineTo(x,y+h);c.closePath();break;
    case 'rtriangle':c.moveTo(x,y);c.lineTo(x+w,y+h);c.lineTo(x,y+h);c.closePath();break;
    case 'diamond':c.moveTo(0,y);c.lineTo(x+w,0);c.lineTo(0,y+h);c.lineTo(x,0);c.closePath();break;
    case 'pentagon':case 'hexagon':case 'octagon':{const n=k==='pentagon'?5:k==='hexagon'?6:8;for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n+(n===6||n===8?Math.PI/n:0);const px=Math.cos(a)*w/2,py=Math.sin(a)*h/2;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();break;}
    case 'star':case 'star8':{const n=k==='star'?5:8;for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n;const rr=i%2?0.42:1;const px=Math.cos(a)*w/2*rr,py=Math.sin(a)*h/2*rr;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();break;}
    case 'heart':c.moveTo(0,h*.38);c.bezierCurveTo(0,h*.05,-w*.5,h*.05,-w*.5,-h*.15);c.bezierCurveTo(-w*.5,-h*.38,-w*.18,-h*.5,0,-h*.25);c.bezierCurveTo(w*.18,-h*.5,w*.5,-h*.38,w*.5,-h*.15);c.bezierCurveTo(w*.5,h*.05,0,h*.05,0,h*.38);c.moveTo(0,h*.5);c.closePath();c.beginPath();c.moveTo(0,h/2);c.bezierCurveTo(-w*.6,h*.1,-w*.55,-h*.5,-w*.2,-h*.5);c.bezierCurveTo(-w*.08,-h*.5,0,-h*.4,0,-h*.3);c.bezierCurveTo(0,-h*.4,w*.08,-h*.5,w*.2,-h*.5);c.bezierCurveTo(w*.55,-h*.5,w*.6,h*.1,0,h/2);c.closePath();break;
    case 'arrow':{const t=h*.3;c.moveTo(x,-t);c.lineTo(w*.1,-t);c.lineTo(w*.1,y);c.lineTo(x+w,0);c.lineTo(w*.1,y+h);c.lineTo(w*.1,t);c.lineTo(x,t);c.closePath();break;}
    case 'cross':{const t=Math.min(w,h)*.18;c.moveTo(-t,y);c.lineTo(t,y);c.lineTo(t,-t);c.lineTo(x+w,-t);c.lineTo(x+w,t);c.lineTo(t,t);c.lineTo(t,y+h);c.lineTo(-t,y+h);c.lineTo(-t,t);c.lineTo(x,t);c.lineTo(x,-t);c.lineTo(-t,-t);c.closePath();break;}
    case 'bubble':{const rr=Math.min(w,h)*.2,bh=h*.82;const by=y+bh;c.moveTo(x+rr,y);c.arcTo(x+w,y,x+w,by,rr);c.arcTo(x+w,by,x,by,rr);c.lineTo(-w*.12,by);c.lineTo(-w*.25,y+h);c.lineTo(-w*.28,by);c.arcTo(x,by,x,y,rr);c.arcTo(x,y,x+w,y,rr);c.closePath();break;}
    case 'ring':c.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);c.moveTo(w*.3,0);c.ellipse(0,0,w*.3,h*.3,0,0,Math.PI*2,true);break;
    case 'blob':{const n=8;const pts=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;const rr=0.78+0.22*Math.sin(i*2.3+1);pts.push([Math.cos(a)*w/2*rr,Math.sin(a)*h/2*rr]);}c.moveTo((pts[0][0]+pts[n-1][0])/2,(pts[0][1]+pts[n-1][1])/2);for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];c.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2);}c.closePath();break;}
    case 'line':c.moveTo(x,0);c.lineTo(x+w,0);break;
    case 'dline':c.moveTo(x,0);c.lineTo(x+w,0);break;
    default:c.rect(x,y,w,h);
  }
}
K.SHAPES=['rect','round','ellipse','triangle','rtriangle','diamond','pentagon','hexagon','octagon','star','star8','heart','arrow','cross','bubble','ring','blob','line','dline'];
const SHAPE_NAMES={rect:'Persegi',round:'Persegi bulat',ellipse:'Elips',triangle:'Segitiga',rtriangle:'Segitiga siku',diamond:'Belah ketupat',pentagon:'Segi lima',hexagon:'Segi enam',octagon:'Segi delapan',star:'Bintang',star8:'Bintang 8',heart:'Hati',arrow:'Panah',cross:'Plus',bubble:'Balon',ring:'Cincin',blob:'Blob',line:'Garis',dline:'Garis putus'};
K.SHAPE_NAMES=SHAPE_NAMES;

/* ---------- drawing objects ---------- */
function fillStyle(c,o,w,h){
  if(o.fill2){const a=(o.ang||0)*Math.PI/180;const dx=Math.cos(a)*w/2,dy=Math.sin(a)*h/2;const g=c.createLinearGradient(-dx,-dy,dx,dy);g.addColorStop(0,o.fill);g.addColorStop(1,o.fill2);return g;}
  return o.fill;
}
K.drawObj=(c,o)=>{
  if(o.hide||K.editing===o.id)return;
  let lines=null;
  if(o.type==='text')lines=K.layout(o,c);
  c.save();
  c.translate(o.x+o.w/2,o.y+o.h/2);c.rotate(o.rot*Math.PI/180);c.scale(o.fx?-1:1,o.fy?-1:1);
  c.globalAlpha=o.op;
  if(o.blend)c.globalCompositeOperation=o.blend;
  if(o.shadow){c.shadowColor=o.shadow.c;c.shadowBlur=o.shadow.b;c.shadowOffsetX=o.shadow.x;c.shadowOffsetY=o.shadow.y;}
  if(o.type==='shape'){
    shapePath(c,o.kind,o.w,o.h,o.radius);
    const line=o.kind==='line'||o.kind==='dline';
    if(!line){c.fillStyle=fillStyle(c,o,o.w,o.h);c.fill('evenodd');}
    if(o.sw>0||line){c.lineWidth=line?Math.max(o.sw,2):o.sw;c.strokeStyle=line?(o.stroke&&o.sw>0?o.stroke:o.fill):o.stroke;c.lineJoin='round';c.lineCap='round';if(o.kind==='dline')c.setLineDash([c.lineWidth*2,c.lineWidth*2.2]);c.stroke();}
  }else if(o.type==='text'){
    c.font=fontStr(o);c.fillStyle=o.color;c.textBaseline='top';
    if('letterSpacing' in c)c.letterSpacing=(o.ls||0)+'px';
    if(o.bgc){c.save();c.shadowColor='transparent';c.fillStyle=o.bgc;const pad=o.size*.18;c.fillRect(-o.w/2-pad,-o.h/2-pad,o.w+pad*2,o.h+pad*2);c.restore();c.fillStyle=o.color;}
    const lh=o.size*o.lh;
    lines.forEach((ln,i)=>{
      const tw=c.measureText(ln).width;let x=-o.w/2;
      if(o.align==='center')x=-tw/2;else if(o.align==='right')x=o.w/2-tw;
      const y=-o.h/2+i*lh+(lh-o.size)/2;
      if(o.tstroke&&o.tsw>0){c.save();c.lineWidth=o.tsw;c.strokeStyle=o.tstroke;c.lineJoin='round';c.strokeText(ln,x,y);c.restore();}
      if(o.color2){const gg=c.createLinearGradient(x,y,x+Math.max(tw,1),y+o.size);gg.addColorStop(0,o.color);gg.addColorStop(1,o.color2);c.fillStyle=gg;}else c.fillStyle=o.color;
      c.fillText(ln,x,y);
      if(o.under){c.fillRect(x,y+o.size*1.04,tw,Math.max(2,o.size/20));}
    });
  }else if(o.type==='image'){
    const im=IM[o.src];
    if(im&&im.el.complete&&im.el.naturalWidth){
      const f=o.f||{};const parts=[];
      if(f.br!==100)parts.push(`brightness(${f.br}%)`);if(f.ct!==100)parts.push(`contrast(${f.ct}%)`);if(f.sa!==100)parts.push(`saturate(${f.sa}%)`);
      if(f.bl>0)parts.push(`blur(${f.bl}px)`);if(f.gr>0)parts.push(`grayscale(${f.gr}%)`);if(f.se>0)parts.push(`sepia(${f.se}%)`);if(f.hu)parts.push(`hue-rotate(${f.hu}deg)`);
      c.save();
      const r=Math.min(o.radius,Math.min(o.w,o.h)/2);
      if(r>0||o.radius>0){shapePath(c,'rect',o.w,o.h,o.radius>=999?9999:r);c.clip();}
      if(parts.length&&'filter' in c)c.filter=parts.join(' ');
      // cover-fit crop: o.crop = {x,y,s}
      const iw=im.el.naturalWidth,ih=im.el.naturalHeight;
      const sc=Math.max(o.w/iw,o.h/ih);const sw=o.w/sc,sh=o.h/sc;
      const cx=(o.cx??.5),cy=(o.cy??.5);
      const sx=(iw-sw)*cx,sy=(ih-sh)*cy;
      c.drawImage(im.el,sx,sy,sw,sh,-o.w/2,-o.h/2,o.w,o.h);
      c.restore();
      if(o.sw>0){shapePath(c,'rect',o.w,o.h,Math.min(o.radius,Math.min(o.w,o.h)/2));c.lineWidth=o.sw;c.strokeStyle=o.stroke||'#000';c.stroke();}
    }else{c.fillStyle='#bbb';c.fillRect(-o.w/2,-o.h/2,o.w,o.h);}
  }else if(o.type==='draw'){
    c.strokeStyle=o.color;c.lineWidth=o.size;c.lineCap='round';c.lineJoin='round';c.beginPath();
    o.pts.forEach((p,i)=>{const px=-o.w/2+p[0]*o.w,py=-o.h/2+p[1]*o.h;i?c.lineTo(px,py):c.moveTo(px,py);});
    if(o.pts.length===1)c.lineTo(-o.w/2+o.pts[0][0]*o.w+.1,-o.h/2+o.pts[0][1]*o.h);
    c.stroke();
  }
  c.restore();
};
K.drawPage=(c,p,scale,noBg)=>{
  c.save();c.scale(scale,scale);
  const b=p.bg;
  if(noBg){}else if(b.c2){const a=(b.ang||0)*Math.PI/180;const cx=p.w/2,cy=p.h/2;const L=Math.abs(Math.cos(a)*p.w)/2+Math.abs(Math.sin(a)*p.h)/2;const g=c.createLinearGradient(cx-Math.cos(a)*L,cy-Math.sin(a)*L,cx+Math.cos(a)*L,cy+Math.sin(a)*L);g.addColorStop(0,b.c);g.addColorStop(1,b.c2);c.fillStyle=g;}else c.fillStyle=b.c;
  if(!noBg)c.fillRect(0,0,p.w,p.h);
  if(!noBg&&b.img&&IM[b.img]&&IM[b.img].el.naturalWidth){const im=IM[b.img].el;const sc=Math.max(p.w/im.naturalWidth,p.h/im.naturalHeight);const w=im.naturalWidth*sc,h=im.naturalHeight*sc;c.drawImage(im,(p.w-w)/2,(p.h-h)/2,w,h);}
  p.objs.forEach(o=>K.drawObj(c,o));
  c.restore();
};

/* ---------- geometry helpers ---------- */
K.center=o=>({x:o.x+o.w/2,y:o.y+o.h/2});
K.toLocal=(o,px,py)=>{const c=K.center(o);const a=-o.rot*Math.PI/180;const dx=px-c.x,dy=py-c.y;return{x:dx*Math.cos(a)-dy*Math.sin(a),y:dx*Math.sin(a)+dy*Math.cos(a)};};
K.corners=o=>{const c=K.center(o),a=o.rot*Math.PI/180,co=Math.cos(a),si=Math.sin(a);return[[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy])=>{const dx=sx*o.w/2,dy=sy*o.h/2;return{x:c.x+dx*co-dy*si,y:c.y+dx*si+dy*co};});};
K.bbox=o=>{const cs=K.corners(o);const xs=cs.map(p=>p.x),ys=cs.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),x2:Math.max(...xs),y2:Math.max(...ys)};};
K.hit=(o,px,py)=>{if(o.hide)return false;const l=K.toLocal(o,px,py);const pad=(o.type==='draw'?o.size/2:0)+(o.kind==='line'||o.kind==='dline'?8:0);return Math.abs(l.x)<=o.w/2+pad&&Math.abs(l.y)<=o.h/2+pad;};
K.s2p=(sx,sy)=>({x:(sx-S.ox)/S.zoom,y:(sy-S.oy)/S.zoom});
K.p2s=(px,py)=>({x:px*S.zoom+S.ox,y:py*S.zoom+S.oy});

/* ---------- viewport ---------- */
const cv=$('#cv'),stage=$('#stage');let cx2=cv.getContext('2d'),dpr=1,W=0,H=0;
let pW=0,pH=0;
K.resize=()=>{dpr=window.devicePixelRatio||1;const nW=stage.clientWidth,nH=stage.clientHeight;if(pW&&(nW!==pW||nH!==pH)){S.ox+=(nW-pW)/2;S.oy+=(nH-pH)/2;}pW=nW;pH=nH;W=nW;H=nH;cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,H*dpr);K.draw();};
K.fit=()=>{const p=page();W=stage.clientWidth;H=stage.clientHeight;const m=W<600?24:56;S.zoom=Math.max(.02,Math.min((W-m)/p.w,(H-m)/p.h));S.ox=(W-p.w*S.zoom)/2;S.oy=(H-p.h*S.zoom)/2;K.draw();K.updateZoomLabel();};
K.zoomAt=(f,sx,sy)=>{const nz=clamp(S.zoom*f,.05,8);const r=nz/S.zoom;sx=sx??W/2;sy=sy??H/2;S.ox=sx-(sx-S.ox)*r;S.oy=sy-(sy-S.oy)*r;S.zoom=nz;K.draw();K.updateZoomLabel();K.placeCtx();};
K.updateZoomLabel=()=>{$('#z-val').textContent=Math.round(S.zoom*100)+'%';};

K.guides=[];K.marquee=null;
K.draw=()=>{
  if(!S.pages.length)return;

  c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);

  if(!o||o.type!=='text'||o.lock)return;
  K.editing=o.id;S.sel=[o.id];K.draw();placeEdit(o);
  ta.style.display='block';ta.value=o.text;ta.focus();ta.select();K.hideCtx&&K.hideCtx();
};
function placeEdit(o){
  const c=K.center(o),s=K.p2s(c.x,c.y);
  ta.style.width=o.w+'px';ta.style.height=o.h+'px';ta.style.left=(s.x-o.w/2)+'px';ta.style.top=(s.y-o.h/2)+'px';
  ta.style.transform=`scale(${S.zoom}) rotate(${o.rot}deg)`;ta.style.transformOrigin='50% 50%';
  ta.style.font=`${o.italic?'italic ':''}${o.weight} ${o.size}px/${o.lh} "${o.font}",sans-serif`;
  ta.style.color=o.color;ta.style.textAlign=o.align;ta.style.letterSpacing=(o.ls||0)+'px';ta.style.textTransform=o.upper?'uppercase':'none';
  ta.style.textDecoration=o.under?'underline':'none';
}
ta.addEventListener('input',()=>{const o=find(K.editing);if(!o)return;o.text=ta.value||' ';o.name=o.text.slice(0,24);K.layout(o);ta.style.height=o.h+'px';K.thumbs();});
ta.addEventListener('keydown',e=>{if(e.key==='Escape'){K.endEdit();e.preventDefault();}e.stopPropagation();});
ta.addEventListener('blur',()=>K.endEdit());
K.endEdit=()=>{if(!K.editing)return;const o=find(K.editing);K.editing=null;ta.style.display='none';if(o){if(!ta.value.trim()){page().objs=page().objs.filter(x=>x!==o);S.sel=[];}else{o.text=ta.value;K.layout(o);}}K.refresh();K.commit(true);};
cv.addEventListener('dblclick',e=>{const m=pos(e);const p=K.s2p(m.x,m.y);const o=topHit(p.x,p.y);if(o&&o.type==='text')K.startEdit(o);});
// double-tap on touch
let lastTap=0,lastTapId=null;
cv.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;const now=Date.now();const m=pos(e);const o=topHit(...Object.values(K.s2p(m.x,m.y)));if(o&&o.type==='text'&&now-lastTap<350&&lastTapId===o.id){K.startEdit(o);}lastTap=now;lastTapId=o&&o.id;});

/* floating toolbar */
const ctxEl=$('#ctx');
const ic=n=>`<svg viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;
K.hideCtx=()=>{ctxEl.style.display='none';};
K.placeCtx=()=>{
  const so=selObjs();
  if(!so.length||drag&&['move','rs','rot','grs','pan'].includes(drag.t)&&drag.moved!==false&&drag.t!=='pan'&&false||K.editing||S.tool!=='select'){ctxEl.style.display='none';return;}
  if(drag&&(drag.t==='move'&&drag.moved||drag.t==='rs'||drag.t==='rot'||drag.t==='grs')){ctxEl.style.display='none';return;}
  const g=K.groupBox();const a=K.p2s(g.x,g.y),b=K.p2s(g.x2,g.y2);
  const o=so[0];
  const btns=[];
  if(so.length===1&&o.type==='text')btns.push(['edit','Edit teks',ic('txt')]);
  if(so.length===1&&o.type==='image')btns.push(['replace','Ganti foto',ic('img')]);
  btns.push(['props','Properti',ic('prop')],['dup','Duplikat',ic('copy')],['front','Ke depan',ic('front')],['back','Ke belakang',ic('back')],['lock',so.every(x=>x.lock)?'Buka kunci':'Kunci',ic(so.every(x=>x.lock)?'unlock':'lock')],['del','Hapus',ic('trash')]);
  ctxEl.innerHTML=btns.map(([k,t,i])=>`<button class="ib" data-a="${k}" title="${t}" aria-label="${t}">${i}</button>`).join('');
  ctxEl.style.display='flex';
  const w=ctxEl.offsetWidth,h=ctxEl.offsetHeight;
  let x=(a.x+b.x)/2-w/2,y=a.y-h-44;
  if(y<6)y=b.y+46;
  x=clamp(x,6,Math.max(6,stage.clientWidth-w-6));y=clamp(y,6,Math.max(6,stage.clientHeight-h-6));
  ctxEl.style.left=x+'px';ctxEl.style.top=y+'px';
};
ctxEl.addEventListener('pointerdown',e=>e.stopPropagation());
ctxEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;act(b.dataset.a);});
function act(a){
  const so=selObjs();
  if(a==='edit')K.startEdit(so[0]);
  else if(a==='replace'){K.replaceTarget=so[0].id;$('#file').click();}
  else if(a==='props')K.toggleProps(true);
  else if(a==='dup')K.dupSel();
  else if(a==='front')K.zorder('front');else if(a==='back')K.zorder('back');
  else if(a==='lock'){const v=!so.every(x=>x.lock);so.forEach(x=>x.lock=v);K.refresh();K.commit(true);}
  else if(a==='del')K.delSel();
  else if(a==='copy')copy();else if(a==='paste')paste();else if(a==='cut'){copy();K.delSel();}
}
/* context menu */
const menu=$('#menu');
function showMenu(x,y,onObj){
  const it=[];
  if(onObj)it.push(['copy','Salin'],['cut','Potong']);
  it.push(['paste','Tempel']);
  if(onObj)it.push(['dup','Duplikat'],'-',['front','Bawa ke depan'],['back','Kirim ke belakang'],['lock','Kunci / buka'],'-',['del','Hapus']);
  menu.innerHTML=it.map(i=>i==='-'?'<hr>':`<button data-a="${i[0]}">${i[1]}</button>`).join('');
  menu.style.display='block';menu.style.left=Math.min(x,innerWidth-190)+'px';menu.style.top=Math.min(y,innerHeight-menu.offsetHeight-8)+'px';
}
function hideMenu(){menu.style.display='none';}
menu.addEventListener('click',e=>{const b=e.target.closest('button');if(b){act(b.dataset.a);hideMenu();}});
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target))hideMenu();},true);

/* clipboard */
function copy(){const so=selObjs();if(!so.length)return;clip=JSON.stringify(so);K.toast('Disalin');}
function paste(){if(!clip)return;const arr=JSON.parse(clip);const ids=[];arr.forEach(o=>{o.id=K.uid();o.x+=40;o.y+=40;page().objs.push(o);ids.push(o.id);});S.sel=ids;K.refresh();K.commit(true);}
document.addEventListener('paste',e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const items=[...(e.clipboardData&&e.clipboardData.items||[])];const img=items.find(i=>i.type.startsWith('image/'));
  if(img){K.addImageFile(img.getAsFile());e.preventDefault();return;}
  paste();
});

/* keyboard */
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(e.code==='Space'){space=true;cv.style.cursor='grab';e.preventDefault();return;}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?K.redo():K.undo();}
  else if(mod&&k==='y'){e.preventDefault();K.redo();}
  else if(mod&&k==='c'){copy();}
  else if(mod&&k==='x'){copy();K.delSel();}
  else if(mod&&k==='d'){e.preventDefault();K.dupSel();}
  else if(mod&&k==='a'){e.preventDefault();S.sel=page().objs.filter(o=>!o.hide).map(o=>o.id);K.refresh();}
  else if(mod&&k==='s'){e.preventDefault();K.saveProject&&K.saveProject();}
  else if(k==='delete'||k==='backspace'){e.preventDefault();K.delSel();}
  else if(k==='escape'){S.sel=[];if(S.tool!=='select')K.setTool('select');K.refresh();}
  else if(k==='enter'&&S.sel.length===1){const o=find(S.sel[0]);if(o&&o.type==='text'){e.preventDefault();K.startEdit(o);}}
  else if(k.startsWith('arrow')&&S.sel.length){e.preventDefault();const st=e.shiftKey?10:1;const so=selObjs().filter(o=>!o.lock);so.forEach(o=>{if(k==='arrowleft')o.x-=st;if(k==='arrowright')o.x+=st;if(k==='arrowup')o.y-=st;if(k==='arrowdown')o.y+=st;});K.draw();K.placeCtx();K.commit();}
  else if(mod&&(k==='='||k==='+')){e.preventDefault();K.zoomAt(1.2);}
  else if(mod&&k==='-'){e.preventDefault();K.zoomAt(1/1.2);}
  else if(mod&&k==='0'){e.preventDefault();K.fit();}
  else if(k==='v')K.setTool('select');else if(k==='h')K.setTool('hand');else if(k==='p')K.setTool('draw');else if(k==='e'&&!mod)K.setTool('erase');
  else if(k==='t'&&!mod){K.addText&&K.addText('heading');}
  else if(k===']'){K.zorder('up');}else if(k==='['){K.zorder('down');}
});
document.addEventListener('keyup',e=>{if(e.code==='Space'){space=false;cv.style.cursor='default';}});

/* images in */
K.addImageFile=(file)=>new Promise(res=>{
  if(!file||!file.type.startsWith('image/'))return res();
  const fr=new FileReader();
  fr.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      // downscale large photos to keep project light
      const MAX=2200;let url=fr.result;
      if(Math.max(img.naturalWidth,img.naturalHeight)>MAX&&file.type!=='image/svg+xml'){const s=MAX/Math.max(img.naturalWidth,img.naturalHeight);const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);url=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.9);}
      const id=K.regImage(url);
      K.placeImage(id,img.naturalWidth,img.naturalHeight);res(id);
    };img.src=fr.result;
  };fr.readAsDataURL(file);
});
K.placeImage=(id,iw,ih)=>{
  const p=page();
  if(K.replaceTarget){const o=find(K.replaceTarget);K.replaceTarget=null;if(o&&o.type==='image'){o.src=id;const r=iw/ih;o.h=o.w/r;K.refresh();K.commit(true);return;}}
  if(K.bgTarget){K.bgTarget=false;p.bg={c:p.bg.c,img:id};K.refresh();K.commit(true);return;}
  const sc=Math.min(p.w*.7/iw,p.h*.7/ih);const w=iw*sc,h=ih*sc;
  K.addObj(K.mkImage(id,(p.w-w)/2,(p.h-h)/2,w,h));
};

/* ---------- export ---------- */
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
function zip(files){ // store-only zip
  const enc=new TextEncoder();const parts=[],cd=[];let off=0;
  files.forEach(f=>{const n=enc.encode(f.name),crc=crc32(f.data);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint32(14,crc,true);lh.setUint32(18,f.data.length,true);lh.setUint32(22,f.data.length,true);lh.setUint16(26,n.length,true);
    parts.push(new Uint8Array(lh.buffer),n,f.data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint32(16,crc,true);ch.setUint32(20,f.data.length,true);ch.setUint32(24,f.data.length,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),n);off+=30+n.length+f.data.length;});
  const cdSize=cd.reduce((a,b)=>a+b.length,0);
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(end.buffer)],{type:'application/zip'});
}
const RES={orig:['Asli',null],hd:['HD',1280],fhd:['Full HD',1920],'2k':['2K',2560],'4k':['4K',3840],'8k':['UHD 8K',7680]};
const scaleFor=(p)=>{const t=RES[EX.res][1];let s=t?t/Math.max(p.w,p.h):EX.mult;const area=p.w*p.h*s*s;if(area>100e6)s=Math.sqrt(100e6/(p.w*p.h));return s;};
function renderPage(p,scale,fmt,transparent){
  const cn=document.createElement('canvas');cn.width=Math.round(p.w*scale);cn.height=Math.round(p.h*scale);
  const g=cn.getContext('2d');
  if(fmt==='jpg'||fmt==='pdf'){g.fillStyle='#fff';g.fillRect(0,0,cn.width,cn.height);}
  K.drawPage(g,p,scale,transparent&&(fmt==='png'||fmt==='webp'));return cn;
}
const toBlob=(cn,type,q)=>new Promise(r=>cn.toBlob(r,type,q));
async function makePDF(pages,q){
  const enc=new TextEncoder();const chunks=[];const offs=[];let len=0;
  const push=x=>{const u=typeof x==='string'?enc.encode(x):x;chunks.push(u);len+=u.length;};
  const obj=(n,fn)=>{offs[n]=len;push(`${n} 0 obj\n`);fn();push('\nendobj\n');};
  push('%PDF-1.4\n');
  const n=pages.length;const kids=pages.map((_,i)=>`${3+i*3} 0 R`).join(' ');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  for(let i=0;i<n;i++){
    const p=pages[i];const cn=renderPage(p,Math.min(scaleFor(p),Math.sqrt(40e6/(p.w*p.h))),'pdf');const jb=new Uint8Array(await (await toBlob(cn,'image/jpeg',q)).arrayBuffer());
    const wpt=(p.w*.75).toFixed(2),hpt=(p.h*.75).toFixed(2);const pg=3+i*3,im=pg+1,ct=pg+2;
    obj(pg,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wpt} ${hpt}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>`));
    obj(im,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${cn.width} /Height ${cn.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jb.length} >>\nstream\n`);push(jb);push('\nendstream');});
    const cs=`q ${wpt} 0 0 ${hpt} 0 0 cm /Im0 Do Q`;
    obj(ct,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  }
  const xref=len;const total=3+n*3;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let i=1;i<total;i++)push(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);

}
let EX={fmt:'png',res:'fhd',mult:1,scope:'cur',q:.92,transparent:false};
const safe=()=> (S.title||'desain').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')||'desain';
const MIME={png:'image/png',jpg:'image/jpeg',webp:'image/webp'};
async function buildExport(){
  const pages=EX.scope==='all'?S.pages:[page()];
  if(EX.fmt==='pdf')return{blob:await makePDF(pages,EX.q),name:safe()+'.pdf',preview:null};
  const ext=EX.fmt;const blobs=[];
  for(const p of pages){const b=await toBlob(renderPage(p,scaleFor(p),EX.fmt,EX.transparent),MIME[ext],EX.q);if(!b)throw new Error('Ukuran terlalu besar untuk perangkat ini, pilih resolusi lebih kecil');blobs.push(b);}
  if(blobs.length===1)return{blob:blobs[0],name:safe()+'.'+ext,preview:blobs[0]};
  const files=[];for(let i=0;i<blobs.length;i++)files.push({name:`${safe()}-${i+1}.${ext}`,data:new Uint8Array(await blobs[i].arrayBuffer())});

async function saveBlob(blob,name){
